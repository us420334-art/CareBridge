<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareBridge Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#eaf5fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

.container{

    width:420px;

    max-width:100%;

    background:white;

    padding:35px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    color:#1b6ca8;

}

.tag{

    text-align:center;

    margin:10px 0 25px;

    color:#666;

}


/* =====================================================
   MESSAGES
===================================================== */

.message{

    padding:13px 15px;

    margin-bottom:18px;

    border-radius:8px;

    font-size:14px;

    line-height:1.5;

}


/* SUCCESS */

.message.success{

    background:#ecfdf5;

    border:1px solid #a7f3d0;

    color:#047857;

}


/* WARNING */

.message.warning{

    background:#fffbeb;

    border:1px solid #fde68a;

    color:#92400e;

}


/* ERROR */

.message.error{

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#b91c1c;

}


/* INFO */

.message.info{

    background:#eff6ff;

    border:1px solid #bfdbfe;

    color:#1d4ed8;

}


/* =====================================================
   OLD ERROR MESSAGE
===================================================== */

.error{

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#b91c1c;

    padding:12px;

    margin-bottom:15px;

    border-radius:8px;

    text-align:center;

    font-size:14px;

}


label{

    font-weight:bold;

    display:block;

}

input{

    width:100%;

    padding:12px;

    margin-top:8px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:6px;

}

input:focus{

    outline:none;

    border-color:#1b6ca8;

    box-shadow:0 0 0 2px rgba(27,108,168,.10);

}

button{

    width:100%;

    padding:12px;

    background:#1b6ca8;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    background:#155a8a;

}

.bottom{

    margin-top:20px;

    text-align:center;

}

.bottom a{

    text-decoration:none;

    color:#1b6ca8;

    font-weight:bold;

}

</style>

</head>


<body>


<div class="container">


<h1>CareBridge</h1>


<p class="tag">

Care Beyond Boundaries

</p>


<!-- =====================================================
     DJANGO MESSAGES
===================================================== -->

{% if messages %}

    {% for message in messages %}

        <div class="message {{ message.tags }}">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}


<!-- =====================================================
     OLD ERROR MESSAGE
===================================================== -->

{% if error %}

    <p class="error">

        {{ error }}

    </p>

{% endif %}


<!-- =====================================================
     LOGIN FORM
===================================================== -->

<form method="POST">

    {% csrf_token %}


    <label>

        Username

    </label>


    <input
        type="text"
        name="username"
        required
        autocomplete="username"
    >


    <label>

        Password

    </label>


    <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
    >


    <button type="submit">

        Login

    </button>


</form>


<div class="bottom">

    Don't have an account?

    <a href="/register/">

        Register

    </a>

</div>


</div>


</body>

</html>
