<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareBridge Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:#eaf5fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

width:420px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

h1{

text-align:center;
color:#1b6ca8;

}

.tag{

text-align:center;
margin:10px 0 25px;
color:#666;

}

label{

font-weight:bold;

}

input{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:6px;

}

button{

width:100%;
padding:12px;
background:#1b6ca8;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#155a8a;

}

.error{

color:red;
margin-bottom:15px;
text-align:center;

}

.bottom{

margin-top:20px;
text-align:center;

}

.bottom a{

text-decoration:none;
color:#1b6ca8;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>CareBridge</h1>

<p class="tag">
Care Beyond Boundaries
</p>

{% if error %}

<p class="error">

{{ error }}

</p>

{% endif %}

<form method="POST">

{% csrf_token %}

<label>Username</label>

<input
type="text"
name="username"
required>

<label>Password</label>

<input
type="password"
name="password"
required>

<button>

Login

</button>

</form>

<div class="bottom">

Don't have an account?

<a href="/register/">

Register

</a>

</div>

</div>

</body>

</html>
