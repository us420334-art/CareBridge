{% extends 'dashboard/base_dashboard.html' %}

{% load static %}


{% block title %}
Edit Profile
{% endblock %}



{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/edit_profile.css' %}?v=1">

{% endblock %}





{% block page_title %}

Edit Profile

{% endblock %}





{% block content %}


<div style="display:none;">
    EDIT PROFILE TEMPLATE LOADED
</div>



<div class="edit-profile-container">


    <div class="edit-profile-card">



        <h2>
            ✏️ Edit Profile
        </h2>



        <form method="POST">


            {% csrf_token %}



            <div class="form-group">

                <label>Email</label>

                <input 
                    type="email"
                    name="email"
                    value="{{ request.user.email }}"
                >

            </div>





            <div class="form-group">

                <label>Phone</label>

                <input 
                    type="text"
                    name="phone"
                    value="{{ profile.phone }}"
                >

            </div>





            <div class="form-group">

                <label>Address</label>

                <textarea name="address">{{ profile.address }}</textarea>

            </div>





            <div class="form-group">

                <label>Role</label>

                <select name="role">

                    <option value="{{ profile.role }}">
                        {{ profile.role }}
                    </option>

                    <option value="Elderly Person">
                        Elderly Person
                    </option>

                    <option value="Person with Mobility Impairment">
                        Person with Mobility Impairment
                    </option>

                    <option value="Person with Hearing Impairment">
                        Person with Hearing Impairment
                    </option>

                    <option value="Care Representative">
                        Care Representative
                    </option>

                    <option value="Caregiver">
                        Caregiver
                    </option>

                    <option value="Volunteer">
                        Volunteer
                    </option>

                </select>

            </div>





            <div class="form-group">

                <label>
                    Emergency Contact Name
                </label>

                <input 
                    type="text"
                    name="emergency_contact_name"
                    value="{{ profile.emergency_contact_name }}"
                >

            </div>





            <div class="form-group">

                <label>
                    Emergency Contact Phone
                </label>

                <input 
                    type="text"
                    name="emergency_contact_phone"
                    value="{{ profile.emergency_contact_phone }}"
                >

            </div>





            <div class="form-group">

                <label>
                    Blood Group
                </label>

                <input 
                    type="text"
                    name="blood_group"
                    value="{{ profile.blood_group }}"
                >

            </div>





            <div class="form-group">

                <label>
                    Medical Conditions
                </label>

                <textarea name="medical_conditions">{{ profile.medical_conditions }}</textarea>

            </div>





            <div class="save-button">

                <button type="submit">

                    Save Changes

                </button>


            </div>




        </form>



    </div>



</div>



{% endblock %}
